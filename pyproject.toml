# BSD-3-Clause License - see LICENSE file
[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-theory"
dynamic = ["version"]
description = "Theoretical estimates for high-speed aerodynamics: skin friction, Stanton number, swallowing length, and more"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [
    {name = "Christoph Hader", email = "chader@arizona.edu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["aerodynamics", "hypersonics", "skin-friction", "boundary-layer", "cfd"]

dependencies = [
    "gasdyn>=0.0.2",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "typer>=0.9.0",
    "flowstate>=0.6.0",
    "similarity-bl>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "zensical",
]

[project.scripts]
flow-theory = "flow_theory.cli.app:app"

[project.urls]
Homepage = "https://github.com/uahypersonics/flow-theory"
Repository = "https://github.com/uahypersonics/flow-theory"
Documentation = "https://uahypersonics.github.io/flow-theory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# version is read from git tags (e.g. v0.1.0 -> 0.1.0)
# write the resolved version to a file so it works without a git repo (e.g. in Docker)
write_to = "src/flow_theory/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
